[package]
org = "zed-pkg"
name = "zed-clients"
version = "0.1.0"
description = "Official polyglot clients for the Zed package registry"
license = "MIT"
keywords = ["clients", "sdk", "polyglot", "zed"]

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"zed-pkg/zed-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".vendor/.zed/**"]

# Whole-repository release surface. Consumers should select a language slice.
[targets.repository]
dir = "."

[targets.nodejs]
dir = "clients/typescript"
name = "zed-clients-nodejs"
adapter = "node"

[targets.python]
dir = "clients/python"
adapter = "python"

[targets.golang]
dir = "clients/go"
name = "zed-clients-golang"
adapter = "go"

[targets.golang.native]
registry = "go-modules"
package = "github.com/zed-pkg/zed-clients/clients/go"
tag_format = "clients/go/v{version}"

[targets.rust]
dir = "clients/rust"
adapter = "rust"

[targets.rust-wasm]
dir = "clients/wasm"
name = "zed-clients-wasm"
adapter = "node"

[targets.dart]
dir = "clients/dart"
adapter = "dart"

[targets.gleam]
dir = "clients/gleam"
adapter = "none"

[targets.erlang]
dir = "clients/erlang"
adapter = "none"

[targets.elixir]
dir = "clients/elixir"
adapter = "none"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.java.native]
registry = "maven-central"
package = "tech.zpkg:zed-client"
forge = ["github-packages", "gitlab-packages", "bitbucket-packages"]

[targets.kotlin]
dir = "clients/kotlin"
adapter = "java"

[targets.kotlin.native]
registry = "maven-central"
package = "tech.zpkg:zed-client-kotlin"
forge = ["github-packages", "gitlab-packages", "bitbucket-packages"]

[targets.ruby]
dir = "clients/ruby"
adapter = "none"

[targets.php]
dir = "clients/php"
adapter = "none"

[targets.swift]
dir = "clients/swift"
