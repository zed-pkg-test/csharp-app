[package]
org = "zed-pkg"
name = "zed-clients"
version = "0.1.0"
description = "Official polyglot clients for the Zed package registry"
license = "MIT"
keywords = ["clients", "sdk", "polyglot", "zed"]

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-clients"

[publish]
include_readme = true
tag_format = "v{version}"

# The whole-repository release surface (zed-docs doc 18). Not a consumer
# dependency and never routed to by `zed add` -- it exists so a release can
# ship the complete reviewed snapshot alongside the per-language slices.
[targets.repository]
dir = "."

[targets.nodejs]
dir = "typescript"
name = "zed-clients-nodejs"
adapter = "node"

[targets.python]
dir = "python"
adapter = "python"

[targets.golang]
dir = "go"
name = "zed-clients-golang"
adapter = "go"

# The module proxy resolves a subdirectory module by `<subdir>/vX.Y.Z`,
# which the repo-global [publish].tag_format cannot express.
[targets.golang.native]
registry = "go-modules"
package = "github.com/zed-pkg/zed-clients/go"
tag_format = "go/v{version}"

[targets.rust]
dir = "rust"
adapter = "rust"
