[package]
org = "zed-pkg"
name = "zed-clients"
version = "0.1.0"
description = "Official polyglot clients for the Zed package registry"
license = "MIT"
keywords = ["clients", "sdk", "polyglot", "zed"]

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-clients"

[publish]
include_readme = true
tag_format = "v{version}"

[targets.nodejs]
dir = "typescript"
name = "zed-clients-nodejs"
adapter = "node"

[targets.python]
dir = "python"

[targets.golang]
dir = "go"
name = "zed-clients-golang"

[targets.rust]
dir = "rust"
