[package]
org = "zed-pkg"
name = "zed-clients"
version = "0.1.0"
description = "Official polyglot clients for the Zed package registry"
license = "MIT"
keywords = ["clients", "sdk", "polyglot", "zed"]

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-clients"

[publish]
include_readme = true
tag_format = "v{version}"

# The whole-repository release surface (zed-docs doc 18). Not a consumer
# dependency and never routed to by `zed add` -- it exists so a release can
# ship the complete reviewed snapshot alongside the per-language slices.
[targets.repository]
dir = "."

[targets.nodejs]
dir = "clients/typescript"
name = "zed-clients-nodejs"
adapter = "node"

[targets.python]
dir = "clients/python"
adapter = "python"

[targets.golang]
dir = "clients/go"
name = "zed-clients-golang"
adapter = "go"

# The module proxy resolves a subdirectory module by `<subdir>/vX.Y.Z`,
# which the repo-global [publish].tag_format cannot express.
[targets.golang.native]
registry = "go-modules"
package = "github.com/zed-pkg/zed-clients/clients/go"
tag_format = "clients/go/v{version}"

[targets.rust]
dir = "clients/rust"
adapter = "rust"

[targets.rust-wasm]
dir = "clients/wasm"
name = "zed-clients-wasm"
adapter = "node"

[targets.dart]
dir = "clients/dart"
adapter = "dart"

# The pinned zed toolchain recognizes Gleam and Erlang as language targets but
# does not yet provide consumer installers. Keep the language-gated slices
# publishable while native BEAM dependency wiring remains the package manager's
# job.
[targets.gleam]
dir = "clients/gleam"
adapter = "none"

[targets.erlang]
dir = "clients/erlang"
adapter = "none"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.java.native]
registry = "maven-central"
package = "tech.zpkg:zed-client"
forge = ["github-packages", "gitlab-packages", "bitbucket-packages"]

[targets.swift]
dir = "clients/swift"
