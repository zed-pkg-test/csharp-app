name: Conformance candidate integration next ten
on:
  push:
    branches: ['ci/conformance-next-ten-20261125-b']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 395
            sha: 'b274fb6b4bee8cd42a7e62fe66ba88d112f79417'
            tests: 'test/actor-stack-containment-v1.test.mjs'
          - pr: 397
            sha: '28e76a8910a43cd226acfd8adf754aacfaf0710f'
            tests: 'test/actor-stack-containment-v1.test.mjs'
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify and exercise exact candidate integration
        env:
          CANDIDATE: ${{ matrix.sha }}
          TEST_FILES: ${{ matrix.tests }}
          BASE: 629e52f60cab36fe121f5858a1424c6cc02b8762
        run: |
          set -euo pipefail
          git init source
          cd source
          git config user.email 'ci@example.invalid'
          git config user.name 'Integration verifier'
          git -c credential.helper= -c http.extraheader= fetch --no-tags https://github.com/atto-lang/atto-platform-conformance.git "$BASE" "$CANDIDATE"
          git checkout --detach "$BASE"
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git rev-parse "$CANDIDATE^{commit}")" = "$CANDIDATE"
          git merge --no-commit --no-ff "$CANDIDATE"
          echo "INTEGRATION_TREE=$(git write-tree)"
          git diff --cached --stat
          for f in $TEST_FILES; do test -f "$f"; done
          case "$TEST_FILES" in
            *.py) python3 -m unittest discover -s tests -p test_aot_adt_guarded_guest.py ;;
            *) node --test $TEST_FILES ;;
          esac
          node --test tests/actor-counter-parity.test.mjs tests/core-option-borrow-parity-v1.test.mjs tests/atto-canonical-syntax-v1.test.mjs tests/eleven-backend-parity-v1.test.mjs
          node --test tests/layout-storage-oracle-aosoa-abi.test.mjs tests/layout-storage-oracle.test.mjs tests/mutex-async-lease-v1.test.mjs tests/portable-task-runner-v1.test.mjs tests/portable-task-v1.test.mjs tests/byte-buffer-v1.test.mjs tests/core-alloc-std-v1.test.mjs tests/typed-arm-task-capture-v1.test.mjs tests/adt-lazy-guard-v2.test.mjs test/five-backend-actor-channel-v1.test.mjs tests/atto-java-llvm-guest-gate.test.mjs tests/proxy-actor-api-parity-v1.test.mjs
          git diff --exit-code
