name: Conformance candidate integration next ten
on:
  push:
    branches: ['ci/conformance-next-ten-20261125-b']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 326
            sha: '5377c9ac04990edd5d560b5b0b1a366a7b5eb0dc'
            tests: 'tests/layout-storage-oracle-aosoa-abi.test.mjs tests/layout-storage-oracle.test.mjs'
          - pr: 391
            sha: '6fbedd5df10d35f8ad0fa83217e376c3a07aa883'
            tests: 'test/actor-stack-containment-v1.test.mjs'
          - pr: 40
            sha: 'd02e05bb6d85b14655a047b349a2a7fdfda26e73'
            tests: 'tests/proxy-actor-api-parity-v1.test.mjs'
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify and exercise exact candidate integration
        env:
          CANDIDATE: ${{ matrix.sha }}
          TEST_FILES: ${{ matrix.tests }}
          BASE: 2c55d06e30d8e440a343842e5c61d21c571f4da4
        run: |
          set -euo pipefail
          git init source
          cd source
          git config user.email 'ci@example.invalid'
          git config user.name 'Integration verifier'
          git -c credential.helper= -c http.extraheader= fetch --no-tags https://github.com/atto-lang/atto-platform-conformance.git "$BASE" "$CANDIDATE"
          git checkout --detach "$BASE"
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git rev-parse "$CANDIDATE^{commit}")" = "$CANDIDATE"
          git merge --no-commit --no-ff "$CANDIDATE"
          echo "INTEGRATION_TREE=$(git write-tree)"
          git diff --cached --stat
          for f in $TEST_FILES; do test -f "$f"; done
          case "$TEST_FILES" in
            *.py) python3 -m unittest discover -s tests -p test_aot_adt_guarded_guest.py ;;
            *) node --test $TEST_FILES ;;
          esac
          if [ "$CANDIDATE" = d02e05bb6d85b14655a047b349a2a7fdfda26e73 ]; then
            for f in tools/proxy_actor_ack_v1.rs tools/proxy_actor_ipc_two_process_v1.rs tools/typed_actor_reply_v1.rs tools/unary_reply_staging_v1.rs; do rustc --edition=2021 --test "$f" -o /tmp/proxy-tests && /tmp/proxy-tests || exit 1; done
          fi
          node --test tests/actor-counter-parity.test.mjs tests/core-option-borrow-parity-v1.test.mjs tests/atto-canonical-syntax-v1.test.mjs tests/eleven-backend-parity-v1.test.mjs
          git diff --exit-code
