name: Next conformance batch pinned integration
on:
  push:
    branches: ['ci/conformance-direct-replacements-20261125-1744']
permissions: {}
jobs:
  verify:
    name: PR ${{ matrix.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 113
            head: '3c59c6106fb12b8160f2e65f39ccdd101de359c6'
            test: "node --test tests/actor-attached-state-v1.test.mjs"
          - pr: 109
            head: '0d6772129d53293316c091423548d8f373c64a40'
            test: "node --test tests/mutex-async-lease-v1.test.mjs"
          - pr: 110
            head: '4117ade5710ecd2436d823fe69c16421e96f7c4c'
            test: "node --test tests/unsafe-blocks-v1.test.mjs"
          - pr: 108
            head: '497bbb53697aed391ac31aa11abba976571f83d3'
            test: "node --test tests/canonical-of-record-generics-v1.test.mjs"
          - pr: 106
            head: 'bc5ece2a1018c92646890318d5cd02e74e4b0be0'
            test: "rustc --edition=2021 --test tests/host-permissions-v1.rs -o /tmp/atto-host-permissions-v1 && /tmp/atto-host-permissions-v1"
          - pr: 119
            head: '23bf5895735a23cac2d0960fcf6ae3ec02d86bb9'
            test: "node --test tests/structural-member-witness-v1.test.mjs"
          - pr: 233
            head: '35939f84725e72eb0defcf9190ee11b4ebaf0dd1'
            test: "node --test tests/cranelift-modern-linked-module-v1.test.mjs"
          - pr: 267
            head: '8c3bdfd7990e4ff5bb800e87470da2fa68cefc90'
            test: "node --test tests/actor-isolation-evidence-v1.test.mjs"
          - pr: 268
            head: '9f2f882a5383fb77645d74a287cc96413c56f939'
            test: "node --test reference/silo/directory.test.mjs reference/persistence-sidecar/*.test.mjs"
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test pinned public integration
        env:
          HEAD_SHA: ${{ matrix.head }}
          TEST_COMMAND: ${{ matrix.test }}
        run: |
          set -euo pipefail
          git init source
          cd source
          git config user.name 'CI integration'
          git config user.email 'ci@example.invalid'
          git -c credential.helper= -c http.extraheader= fetch --no-tags https://github.com/atto-lang/atto-platform-conformance.git 44d517fc2ed22e82febb6bf729597c163ee5f98b "$HEAD_SHA"
          git checkout --detach 44d517fc2ed22e82febb6bf729597c163ee5f98b
          git merge --no-ff --no-edit "$HEAD_SHA"
          echo "TESTED TREE $(git rev-parse 'HEAD^{tree}') PARENTS $(git log -1 --format=%P)"
          bash -euo pipefail -c "$TEST_COMMAND"
          node --test tests/cooperative-execution.test.mjs tests/cooperative-execution-hardening.test.mjs tests/execution-context-unwind-v1.test.mjs tests/susp_effect_alias_registry.test.mjs
          git diff --exit-code HEAD --
