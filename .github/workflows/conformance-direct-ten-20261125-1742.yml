name: Next conformance batch pinned integration
on:
  push:
    branches: ['ci/conformance-next-replacements-20261125-1754']
permissions: {}
jobs:
  verify:
    name: PR ${{ matrix.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 346
            head: 'bee3ee4ae2195952daeada5d8a07c863e520dc11'
            test: "node --test tests/runner-admission-evidence-v1.test.mjs"
          - pr: 336
            head: '48e6dad8eef9aae5f52198a4e1e7cd1d47ced52a'
            test: "node --test test/manifest-security-ci.test.mjs"
          - pr: 325
            head: 'df360c2907b1cd0b34d745cbd186e175f4ecd9c1'
            test: "node --test tests/merge-qualification-policy-20261106.test.mjs"
          - pr: 324
            head: 'ea4e9196a70bfa788b2d14934a62b64f0ece5af7'
            test: "node --test tests/wave-two-postmerge-intake-20261106.test.mjs"
          - pr: 323
            head: '035cfb8ac3414df2c99a5f25adb4f7648309abb8'
            test: "node --test tests/audit-coverage-receipt-v1.test.mjs"
          - pr: 322
            head: '5c2ff06519a013c15f347368cfa72f6bb292cf96'
            test: "node --test tests/audit-blocker-graph-v1.test.mjs"
          - pr: 321
            head: 'a7ca8dc30de4feee56a69182cd3ade0daec47eb4'
            test: "node --test tests/audit-checkpoint-sequence-v1.test.mjs"
          - pr: 314
            head: '978211a03187e9364154a58412b8a4ec888fea85'
            test: "node --test tests/merge-wave-live-evidence-v1.test.mjs"
          - pr: 310
            head: 'e4bc75bb4ca6db5eca03b944fef1658637a7635f'
            test: "node --test tests/merge-wave-review-timeline.test.mjs"
          - pr: 307
            head: '24ce3d2c494616dab80e6e73543d801caa212eab'
            test: "node --test tests/runner_admission_support_packet_20261106.test.mjs"
          - pr: 305
            head: 'dd138a6504c340c4c66f457e632ceb1691e8dc83'
            test: "node --test tests/merge-wave-qualifier.test.mjs"
          - pr: 303
            head: 'bf8939f352f4bdf42504854e51981d4fcc9d4392'
            test: "node --test tests/pr-blocker-ledger-v1.test.mjs"
          - pr: 291
            head: '03d4ce0c7f7864c42411c4984fe3db123106bcd7'
            test: "node --test tests/verify-exact-head-evidence.test.mjs"
          - pr: 281
            head: '86e4c652fb5f9de08f1a8724e10de58058b297b4'
            test: "node --test tests/aot-artifact-v2.test.mjs tests/aot-v2-golden-vector.test.mjs tests/aot-v2-schema-drift.test.mjs"
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test pinned public integration
        env:
          HEAD_SHA: ${{ matrix.head }}
          TEST_COMMAND: ${{ matrix.test }}
        run: |
          set -euo pipefail
          git init source
          cd source
          git config user.name 'CI integration'
          git config user.email 'ci@example.invalid'
          git -c credential.helper= -c http.extraheader= fetch --no-tags https://github.com/atto-lang/atto-platform-conformance.git 0f3a1e379e2dedf524d6f76fad98d4ef5a71733e "$HEAD_SHA"
          git checkout --detach 0f3a1e379e2dedf524d6f76fad98d4ef5a71733e
          git merge --no-ff --no-edit "$HEAD_SHA"
          echo "TESTED TREE $(git rev-parse 'HEAD^{tree}') PARENTS $(git log -1 --format=%P)"
          bash -euo pipefail -c "$TEST_COMMAND"
          node --test tests/cooperative-execution.test.mjs tests/cooperative-execution-hardening.test.mjs tests/execution-context-unwind-v1.test.mjs tests/susp_effect_alias_registry.test.mjs
          git diff --exit-code HEAD --
