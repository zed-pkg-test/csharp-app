name: Thirteenth batch pinned public integrations
on:
  push:
    branches: ['ci/conformance-thirteenth-ten-20261125']
permissions: {}
jobs:
  verify:
    name: PR ${{ matrix.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 74
            head: 'de7e252cd344b3fbeead8d00fe14ab7d140c684d'
            test: "python3 bin/validate_implicit_argument_borrow.py && python3 -O tests/implicit_argument_borrow_validator_smoke.py"
          - pr: 541
            head: '63234d01540cbba3363502df8d6f8912c2c481f7'
            test: "node bin/validate-lambda-v1.mjs && node --test test/lambda-v1-manifest.test.mjs test/lambda-v1-python.test.mjs && python3 -m unittest discover -s tests -p test_run_lambda_v1.py"
          - pr: 484
            head: '0e4ab4eac6527b7d9daf61bcafce0bc7d87acf7e'
            test: "node --test test/erl-otp-static-reference.test.mjs test/erl-otp-strict-aot-contract.test.mjs test/erl-otp-strict-aot-receipt.test.mjs"
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test pinned public integration
        env:
          HEAD_SHA: ${{ matrix.head }}
          TEST_COMMAND: ${{ matrix.test }}
        run: |
          set -euo pipefail
          git init source
          cd source
          git config user.name 'CI integration'
          git config user.email 'ci@example.invalid'
          git -c credential.helper= -c http.extraheader= fetch --no-tags https://github.com/atto-lang/atto-platform-conformance.git a4e6109ea068849e028834a990e605c381e811f5 "$HEAD_SHA"
          git checkout --detach a4e6109ea068849e028834a990e605c381e811f5
          test "$(git rev-parse 'HEAD^{tree}')" = dd9da5bd4ea8c25dc1f3385828ed309909463e50
          git merge --no-ff --no-edit "$HEAD_SHA"
          echo "TESTED TREE $(git rev-parse 'HEAD^{tree}') PARENTS $(git log -1 --format=%P)"
          bash -euo pipefail -c "$TEST_COMMAND"
          git diff --exit-code HEAD --
