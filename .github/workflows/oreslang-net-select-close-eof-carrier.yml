name: Oreslang .NET select close EOF carrier

on:
  push:
    branches:
      - ci/oreslang-net-select-close-eof-9597dd19

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run exact-file carrier
        run: dotnet run --project oreslang-carrier/OresCarrier.csproj -c Release
