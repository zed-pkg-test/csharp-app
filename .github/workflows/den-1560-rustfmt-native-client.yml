name: DEN-1560 apply canonical Rust formatting

on:
  push:
    branches:
      - alexanderdmills/den-1560-rustfmt-native-client
    paths:
      - .github/workflows/den-1560-rustfmt-native-client.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: alexanderdmills/den-1560-rustfmt-native-client
          persist-credentials: true
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply the pinned replay's canonical formatting
        run: |
          rustfmt --edition 2021 clients/rust/src/lib.rs
          git diff --check
          git diff -- clients/rust/src/lib.rs

      - name: Remove this workflow and commit only the formatted source
        run: |
          rm .github/workflows/den-1560-rustfmt-native-client.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add clients/rust/src/lib.rs .github/workflows/den-1560-rustfmt-native-client.yml
          git commit -m 'style: apply canonical rustfmt to the native client'
          git push origin HEAD:alexanderdmills/den-1560-rustfmt-native-client
