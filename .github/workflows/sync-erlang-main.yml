name: sync Erlang hardening with main

on:
  push:
    branches:
      - alexanderdmills/den-1403-erlang-client-hardening
    paths:
      - .github/workflows/sync-erlang-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: alexanderdmills/den-1403-erlang-client-hardening
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - name: Merge current main and preserve both language hardening slices
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-ff --no-edit origin/main
          git rm .github/workflows/sync-erlang-main.yml
          git commit -m 'chore: remove temporary branch synchronization workflow'
          git push origin HEAD:alexanderdmills/den-1403-erlang-client-hardening
