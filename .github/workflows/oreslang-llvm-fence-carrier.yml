name: Oreslang LLVM continuation fence carrier
on:
  push:
    branches:
      - ci/oreslang-llvm-fence-0032a36c-20261026
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C++17 fence proof
        run: |
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -UNDEBUG \
            -I oreslang-fence-carrier/llvm/src/main/cpp \
            oreslang-fence-carrier/llvm/tests/native_select_continuation_fence_test.cpp \
            -o /tmp/oreslang-select-fence
          /tmp/oreslang-select-fence
