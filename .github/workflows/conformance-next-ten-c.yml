name: Public conformance integration verification C
on:
  push:
    branches: ['ci/conformance-next-ten-20261125-c']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 89
            sha: 'e7b329ce5b1702a4bd50f9ac2aa7da1192996660'
            command: 'node --test tests/implements-receiver-conformance-v1.test.mjs'
          - pr: 235
            sha: '1b7fc2af6bde29d937a6809621dd3d3a625c836e'
            command: 'node --test tests/checked-i64-all-backends-v1.test.mjs'
          - pr: 75
            sha: '43546e00db09dcc17675f552eb4f8b5bee752bca'
            command: 'python3 bin/validate_shared_ownership_and_guards.py'
          - pr: 50
            sha: '4c45aaa74f9ccea1022732202329d9cfcb5b6e01'
            command: 'node --test tests/stdio-channel-endpoints.test.mjs && python3 -m unittest discover -s tests -p test_channel_return_ownership_contract.py'
          - pr: 279
            sha: '687b06c3f89899b9f45f226684e931ba875dbacc'
            command: 'node --test tests/media-replay*.test.mjs'
          - pr: 285
            sha: '7f60d6d97ce9ae367d1299bda5109d5f2a879ec4'
            command: 'node --test test/atto-parity-receipt.test.mjs tests/implements-receiver-conformance-v1.test.mjs tests/checked-i64-all-backends-v1.test.mjs tests/stdio-channel-endpoints.test.mjs tests/media-replay*.test.mjs tests/unsafe-blocks-v1.test.mjs tests/cranelift-modern-linked-module-v1.test.mjs test/actor-stack-containment-v1.test.mjs && python3 bin/validate_shared_ownership_and_guards.py && python3 -m unittest discover -s tests -p test_channel_return_ownership_contract.py && python3 -m unittest discover -s tests -p test_aot_adt_guarded_guest.py'
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test pinned public source integration
        env:
          CANDIDATE: ${{ matrix.sha }}
          BASE: 492ee193e1000173f44314a3a297ed7181c25e07
        run: |
          set -euo pipefail
          git init source
          cd source
          git config user.email 'ci@example.invalid'
          git config user.name 'Integration verifier'
          git -c credential.helper= -c http.extraheader= fetch --no-tags https://github.com/atto-lang/atto-platform-conformance.git "$BASE" "$CANDIDATE"
          git checkout --detach "$BASE"
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git rev-parse "$CANDIDATE^{commit}")" = "$CANDIDATE"
          git merge --no-commit --no-ff "$CANDIDATE"
          echo "INTEGRATION_TREE=$(git write-tree)"
          git diff --cached --stat
          ${{ matrix.command }}
          node --test tests/actor-counter-parity.test.mjs tests/core-option-borrow-parity-v1.test.mjs tests/atto-canonical-syntax-v1.test.mjs tests/eleven-backend-parity-v1.test.mjs
          git diff --exit-code
