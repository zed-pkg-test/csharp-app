name: DEN-1565 apply canonical Dart formatting

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-1565-dartfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          show-progress: false
          fetch-depth: 0
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: 3.11.4

      - name: Apply canonical Dart formatting
        working-directory: clients/dart
        run: |
          dart --disable-analytics
          dart format lib test
          git diff --check
          git diff -- lib test

      - name: Restore permanent CI
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit and push only the formatted Dart files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add clients/dart/lib clients/dart/test .github/workflows/ci.yml
          git commit -m 'style: apply canonical Dart formatting to the client package'
          git push origin HEAD:${{ github.head_ref }}
