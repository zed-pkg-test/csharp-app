name: DEN-1560 apply canonical Rust formatting

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/den-1560-rustfmt-native-client.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-1560-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          show-progress: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply canonical Rust formatting
        run: |
          rustfmt --edition 2021 clients/rust/src/lib.rs
          git diff --check
          git diff -- clients/rust/src/lib.rs

      - name: Restore permanent CI and remove the patch-only workflow
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/den-1560-rustfmt-native-client.yml

      - name: Commit and push only the formatted source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            clients/rust/src/lib.rs \
            .github/workflows/ci.yml \
            .github/workflows/den-1560-rustfmt-native-client.yml
          git commit -m 'style: apply canonical rustfmt to the native client'
          git push origin HEAD:${{ github.head_ref }}
