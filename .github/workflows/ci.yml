name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zed-clients-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-exact-head-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          show-progress: false

      - name: Replace malformed generated tests by token boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def function_end(source: str, opening_brace: int) -> int:
              depth = 0
              in_string = False
              escaped = False
              for index in range(opening_brace, len(source)):
                  char = source[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == '"':
                          in_string = False
                      continue
                  if char == '"':
                      in_string = True
                  elif char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return index + 1
              raise SystemExit('unterminated function body')

          wasm = Path('clients/wasm/src/lib.rs')
          source = wasm.read_text(encoding='utf-8')
          token = 'fn missing_token_and_invalid_constructor_state_fail_before_transport() {'
          start = source.index(token)
          line_start = source.rfind('\n', 0, start) + 1
          body_end = function_end(source, source.index('{', start))
          replacement = '''    fn missing_token_and_invalid_constructor_state_fail_before_transport() {
              let client = ZedClient::new(Some("relative/path".to_string()));
              assert!(client.configuration_error.is_some());

              let mut client = ZedClient::new(Some("https://registry.test".to_string()));
              assert!(client.token.is_none());
              client.with_token("   ".to_string());
              assert!(client.token.is_none());
          }'''
          wasm.write_text(
              source[:line_start] + replacement + source[body_end:],
              encoding='utf-8',
          )

          swift = Path('clients/swift/Tests/ZedClientTests/ZedClientTests.swift')
          source = swift.read_text(encoding='utf-8')
          start_token = 'func testRejectsHostileSegmentsBeforeTransport() async throws {'
          end_token = 'func testAuthenticatedOperationsRequireTokenBeforeTransport() async throws {'
          start = source.index(start_token)
          line_start = source.rfind('\n', 0, start) + 1
          end = source.index(end_token, start)
          end_after = end + len(end_token)
          replacement = '''    func testRejectsHostileSegmentsBeforeTransport() async throws {
              let client = try makeClient()
              let hostileValues = [
                  "",
                  "   ",
                  ".",
                  "..",
                  String(UnicodeScalar(10)!),
              ]
              for value in hostileValues {
                  do {
                      _ = try await client.getPackage(org: value, name: "kit")
                      XCTFail("expected segment rejection for \\(value.debugDescription)")
                  } catch let error as ZedClientError {
                      guard case .invalidConfiguration = error else {
                          return XCTFail("unexpected error: \\(error)")
                      }
                  }
              }
          }

          func testRelativeDownloadURLPreservesGatewayAndUppercaseDigest() async throws {
              let artifact = Data("abc".utf8)
              let recorder = RequestRecorder()
              StubURLProtocol.handler = { request in
                  recorder.append(request)
                  return StubResponse(status: 200, body: artifact)
              }
              let client = try makeClient(basePath: "/gateway")
              let version = VersionMetadata(
                  org: "acme",
                  name: "kit",
                  version: "1.0.0",
                  sha256: "BA7816BF8F01CFEA414140DE5DAE2223B00361A396177A9CB410FF61F20015AD",
                  size: Int64(artifact.count),
                  format: "tar.gz",
                  vcsTag: "v1.0.0",
                  vcsCommit: nil,
                  downloadURL: "artifacts/hash",
                  publishedAt: "now",
                  yanked: false
              )
              let downloaded = try await client.downloadArtifact(version)
              XCTAssertEqual(downloaded, artifact)
              XCTAssertEqual(
                  recorder.snapshot().first?.url?.path,
                  "/gateway/artifacts/hash"
              )
          }

          func testBlankStructuredErrorCodeFallsBackToHTTPStatus() async throws {
              StubURLProtocol.handler = { _ in
                  StubResponse(
                      status: 409,
                      body: Data(#"{"code":"   ","message":"remote detail"}"#.utf8)
                  )
              }
              let client = try makeClient(token: "token")
              do {
                  _ = try await client.claimOrg(slug: "acme")
                  XCTFail("expected API error")
              } catch let error as ZedClientError {
                  guard case let .api(status, code, _) = error else {
                      return XCTFail("unexpected error: \\(error)")
                  }
                  XCTAssertEqual(status, 409)
                  XCTAssertEqual(code, "http_409")
              }
          }

          func testAuthenticatedOperationsRequireTokenBeforeTransport() async throws {'''
          swift.write_text(
              source[:line_start] + replacement + source[end_after:],
              encoding='utf-8',
          )
          PY
          rustfmt --edition 2021 clients/wasm/src/lib.rs
          git diff --check

      - name: Commit and push the asserted test fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add clients/wasm/src/lib.rs clients/swift/Tests/ZedClientTests/ZedClientTests.swift
          git commit -m 'DEN-1403 normalize WASM and Swift hardening tests'
          git push origin HEAD:${{ github.head_ref }}
