name: DEN-1459 apply Erlang token revalidation

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/den-1459-erlang-token-revalidation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-1459-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          show-progress: false
          fetch-depth: 0

      - name: Apply exact fail-closed source and test corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

          source = Path('clients/erlang/src/zed_pkg_client.erl')
          replace_once(
              source,
              '''-define(MAX_ERROR_BODY_BYTES, 16384).
          -define(MAX_PATH_SEGMENT_BYTES, 256).
          ''',
              '''-define(MAX_ERROR_BODY_BYTES, 16384).
          -define(MAX_PATH_SEGMENT_BYTES, 256).
          -define(MAX_TOKEN_BYTES, 8192).
          ''',
              'token ceiling constant',
          )
          replace_once(
              source,
              '''%% containing control characters are retained as an error so auth fails before
          %% transport instead of creating an unsafe header.
          with_token(Client, Token) when is_map(Client) ->
              case normalize_token(Token) of
                  {ok, Normalized} -> Client#{token => Normalized, token_error => undefined};
                  {error, Reason} -> Client#{token => undefined, token_error => Reason}
              end.
          ''',
              '''%% containing control characters or exceeding the credential ceiling are retained
          %% as an error so auth fails before transport instead of creating an unsafe header.
          with_token(Client, Token) when is_map(Client) ->
              case normalize_token(Token) of
                  {ok, Normalized} -> Client#{token => Normalized, token_error => undefined};
                  {error, Reason} -> Client#{token => undefined, token_error => Reason}
              end;
          with_token(_Client, _Token) ->
              {error, {invalid_configuration, <<"client must be a map returned by new/1">>}}.
          ''',
              'with_token invalid-client handling',
          )
          replace_once(
              source,
              '''        _ ->
                  case has_control(Token) of
                      true -> {error, {invalid_input, <<"token must not contain control characters">>}};
                      false -> {ok, Token}
                  end
          ''',
              '''        _ ->
                  case byte_size(Token) > ?MAX_TOKEN_BYTES of
                      true ->
                          {error,
                              {invalid_input,
                                  <<"token must not exceed 8192 UTF-8 bytes">>}};
                      false ->
                          case has_control(Token) of
                              true ->
                                  {error,
                                      {invalid_input,
                                          <<"token must not contain control characters">>}};
                              false -> {ok, Token}
                          end
                  end
          ''',
              'token length and control validation',
          )
          replace_once(
              source,
              '''auth_headers(Client, true) ->
              case maps:get(token_error, Client, undefined) of
                  undefined ->
                      case maps:get(token, Client, undefined) of
                          undefined ->
                              {error,
                                  {missing_token,
                                      <<"authenticated registry operation requires a nonblank bearer token">>}};
                          Token -> {ok, [{"authorization", "Bearer " ++ binary_to_list(Token)}]}
                      end;
                  TokenError -> {error, TokenError}
              end;
          auth_headers(_Client, false) ->
              {ok, []}.
          ''',
              '''auth_headers(Client, true) when is_map(Client) ->
              case maps:get(token_error, Client, undefined) of
                  undefined ->
                      %% Client maps remain transparent for compatibility, so callers can mutate
                      %% them after construction. Revalidate the live token on every authenticated
                      %% operation instead of trusting only with_token/2 state.
                      case normalize_token(maps:get(token, Client, undefined)) of
                          {ok, undefined} ->
                              {error,
                                  {missing_token,
                                      <<"authenticated registry operation requires a nonblank bearer token">>}};
                          {ok, Token} ->
                              {ok, [{"authorization", "Bearer " ++ binary_to_list(Token)}]};
                          {error, Reason} -> {error, Reason}
                      end;
                  TokenError -> {error, TokenError}
              end;
          auth_headers(_Client, true) ->
              {error, {invalid_configuration, <<"client must be a map returned by new/1">>}};
          auth_headers(_Client, false) ->
              {ok, []}.
          ''',
              'per-operation token revalidation',
          )

          tests = Path('clients/erlang/test/zed_pkg_client_hardening_tests.erl')
          replace_once(
              tests,
              '''-define(MAX_ERROR_BODY_BYTES, 16384).
          ''',
              '''-define(MAX_ERROR_BODY_BYTES, 16384).
          -define(MAX_TOKEN_BYTES, 8192).
          ''',
              'test token ceiling constant',
          )
          replace_once(
              tests,
              '''    UnsafeToken = zed_pkg_client:with_token(Client, <<"token\\r\\nheader">>),
              ?assertMatch(
                  {error, {invalid_input, _}},
                  zed_pkg_client:claim_org(UnsafeToken, "acme")
              ).
          ''',
              '''    UnsafeToken = zed_pkg_client:with_token(Client, <<"token\\r\\nheader">>),
              ?assertMatch(
                  {error, {invalid_input, _}},
                  zed_pkg_client:claim_org(UnsafeToken, "acme")
              ),
              BoundaryToken = binary:copy(<<"t">>, ?MAX_TOKEN_BYTES),
              BoundaryClient = zed_pkg_client:with_token(Client, BoundaryToken),
              ?assertEqual(?MAX_TOKEN_BYTES, byte_size(maps:get(token, BoundaryClient))),
              OverlongToken = binary:copy(<<"t">>, ?MAX_TOKEN_BYTES + 1),
              OverlongClient = zed_pkg_client:with_token(Client, OverlongToken),
              ?assertMatch(
                  {error, {invalid_input, _}},
                  zed_pkg_client:claim_org(OverlongClient, "acme")
              ),
              MutatedClient = Client#{
                  token => <<"token\\r\\nheader">>,
                  token_error => undefined
              },
              ?assertMatch(
                  {error, {invalid_input, _}},
                  zed_pkg_client:restore(MutatedClient, "acme", "kit", "1.2.0")
              ),
              ?assertMatch(
                  {error, {invalid_configuration, _}},
                  zed_pkg_client:publish(not_a_client, "acme", "kit", "1.2.0", Meta, <<"bytes">>)
              ),
              ?assertMatch(
                  {error, {invalid_configuration, _}},
                  zed_pkg_client:with_token(not_a_client, <<"token">>)
              ).
          ''',
              'token mutation and boundary regressions',
          )
          PY
          git diff --check

      - name: Restore permanent CI and remove the inert patch workflow
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/den-1459-erlang-token-revalidation.yml

      - name: Commit and push only reviewed product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add clients/erlang/src/zed_pkg_client.erl \
            clients/erlang/test/zed_pkg_client_hardening_tests.erl \
            .github/workflows/ci.yml \
            .github/workflows/den-1459-erlang-token-revalidation.yml
          git commit -m 'DEN-1459 revalidate mutable Erlang bearer state'
          git push origin HEAD:${{ github.head_ref }}
