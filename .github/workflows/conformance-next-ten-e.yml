name: Conformance and parity exact integration E
on:
  push:
    branches: ['ci/conformance-next-ten-20261125-e']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 332
            repo: 'atto-lang/atto-platform-conformance'
            base: 'a5471334596261854d29543aaef69964cea160d6'
            sha: '5efd9ff3d3390d72b9d144d1587e80aed76e7b55'
            command: 'node --test tests/dop-four-layout-input-security.test.mjs test/dop-four-layout*.test.mjs test/heterogeneous-four-layout*.test.mjs tests/layout-storage-oracle*.test.mjs'
          - pr: 263
            repo: 'atto-lang/atto-platform-conformance'
            base: 'a5471334596261854d29543aaef69964cea160d6'
            sha: 'db9f51375fc40ff714a6ed4a8f5d140988298734'
            command: 'cargo test --manifest-path verification/formal-proof-replay/Cargo.toml --locked --all-targets && cargo build --manifest-path verification/formal-proof-replay/Cargo.toml --locked'
          - pr: 46
            repo: 'atto-lang/atto-compilers-parity-testing'
            base: 'bd2e69912cea903de21f3a5e53e0b32d653bef25'
            sha: '72ae9dffc6c6801528bb7a694d57effd5b69bde1'
            command: 'node --test tests/corpus-report-admission.test.mjs && cargo run --quiet --locked --manifest-path tools/parity-runner/Cargo.toml -- --output parity-results.json && node tools/corpus-report-admission.mjs parity-results.json'
          - pr: 51
            repo: 'atto-lang/atto-compilers-parity-testing'
            base: 'bd2e69912cea903de21f3a5e53e0b32d653bef25'
            sha: '8ca7ef8bfafeb37a5519e3ea711988f12e47d2b5'
            command: 'node --test tests/generator-lifecycle-v1.test.mjs'
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify pinned public integration and run focused tests
        env:
          BASE: ${{ matrix.base }}
          CANDIDATE: ${{ matrix.sha }}
          SOURCE_REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          git init source
          cd source
          git config user.email 'ci@example.invalid'
          git config user.name 'Integration verifier'
          git -c credential.helper= -c http.extraheader= fetch --no-tags "https://github.com/$SOURCE_REPO.git" "$BASE" "$CANDIDATE"
          git checkout --detach "$BASE"
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git rev-parse "$CANDIDATE^{commit}")" = "$CANDIDATE"
          git merge --no-commit --no-ff "$CANDIDATE"
          echo "INTEGRATION_TREE=$(git write-tree)"
          git diff --cached --stat
          ${{ matrix.command }}
          if [ "${{ matrix.pr }}" = "263" ]; then
            if ! command -v z3 >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y z3; fi
            z3 --version
            replay="$(pwd)/verification/formal-proof-replay/target/debug/oreslang-formal-proof-replay"
            test -x "$replay"
            scratch="$(mktemp -d)"
            mkdir -p "$scratch/source" "$scratch/queries"
            git -C "$scratch/source" init -q
            printf 'minimum(a,b) = if a <= b then a else b\n' > "$scratch/source/min.txt"
            git -C "$scratch/source" add min.txt
            git -C "$scratch/source" -c user.email=ci@example.invalid -c user.name=CI commit -qm smoke
            printf '(declare-const a Int)\n(declare-const b Int)\n(assert (> (ite (<= a b) a b) a))\n(check-sat)\n' > "$scratch/queries/proof.smt2"
            printf '(declare-const a Int)\n(declare-const b Int)\n(assert (> (ite (<= a b) b a) a))\n(check-sat)\n' > "$scratch/queries/mutant.smt2"
            solver="$(readlink -f "$(command -v z3)")"
            proof="$(sha256sum "$scratch/queries/proof.smt2" | cut -d' ' -f1)"
            mutant="$(sha256sum "$scratch/queries/mutant.smt2" | cut -d' ' -f1)"
            args=(--repository "$scratch/source" --commit "$(git -C "$scratch/source" rev-parse HEAD)" --source min.txt --source-blob "$(git -C "$scratch/source" hash-object min.txt)" --query-root "$scratch/queries" --solver "$solver" --solver-sha256 "$(sha256sum "$solver" | cut -d' ' -f1)")
            "$replay" "${args[@]}" --proof "min-proof:proof.smt2:$proof" --mutant "min-mutant:mutant.smt2:$mutant"
            if "$replay" "${args[@]}" --proof "min-proof:proof.smt2:$proof" --mutant "min-mutant:proof.smt2:$proof"; then exit 1; fi
            rm -rf "$scratch"
          fi
          git diff --exit-code
