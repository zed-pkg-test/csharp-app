name: Landed twelfth batch cumulative regression
on:
  push:
    branches: ['ci/conformance-twelfth-ten-20261125']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact landed merge and run cumulative contracts
        run: |
          set -euo pipefail
          git init source
          cd source
          git -c credential.helper= -c http.extraheader= fetch --depth=1 https://github.com/atto-lang/atto-platform-conformance.git cf7040a310d9aae50412aa68d042baf6b92d15ee
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = cf7040a310d9aae50412aa68d042baf6b92d15ee
          test "$(git rev-parse 'HEAD^{tree}')" = b7b2edef2e09694ca657d49896209110e4f1abcb
          node bin/check-actor-external-entrypoints-v1.mjs
          python3 -m unittest discover -s tests -p 'test_hosted_*parity_v1.py'
          python3 -m unittest discover -s tests -p test_core_ownership_borrow_parity_v1.py
          python3 -m unittest discover -s tests -p test_hosted_fs_file_port_v1.py
          python3 -m unittest discover -s tests -p 'test_actor_scheduler_*v1.py'
          rustc --edition=2021 --test tests/actor_elastic_parity_v1.rs -o /tmp/actor-elastic-tests
          /tmp/actor-elastic-tests
          cargo test --manifest-path test/rust-source-admission/Cargo.toml
          python3 -m unittest discover -s tests -p test_ffi_boundary_v1.py
          python3 -m unittest discover -s tests -p test_copy_modes_v2.py
          python3 -m unittest discover -s tests -p test_return_type_inference_contract.py
          python3 -m unittest discover -s tests -p test_typeof_spelling_contract.py
          python3 -m unittest discover -s tests -p test_actor_persistence_contract.py
          for f in tests/io_detached_oracle.rs tests/io_direction_oracle.rs tests/io_effect_oracle.rs tests/stdio_unbounded_oracle.rs; do rustc --edition=2021 --test "$f" -o /tmp/io-tests && /tmp/io-tests || exit 1; done
          python3 -m unittest discover -s tests -p 'test_net_http*_source.py'
          rustc --edition=2021 --test tests/pointer_local_lease_oracle_v1.rs -o /tmp/pointer-tests
          /tmp/pointer-tests
          for f in tools/typed_actor_fixture_identity.rs tools/typed_actor_backend_inventory.rs tools/typed_actor_v1.rs tools/typed_actor_control_boundary_v1.rs tools/typed_actor_string_targets.rs tools/typed_actor_bool_v1.rs tools/actor_isolation_types_v1.rs tools/actor_isolation_broker_v1.rs; do rustc --edition=2021 --test "$f" -o /tmp/typed-tests && /tmp/typed-tests || exit 1; done
          node formal/fleet/check_coverage.cjs
          rustc --edition=2021 -D warnings tools/actor_aot_guest_gate.rs -o /tmp/actor-gate
          if /tmp/actor-gate; then exit 1; fi
