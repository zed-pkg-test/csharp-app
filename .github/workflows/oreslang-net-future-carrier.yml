name: Oreslang .NET selectable Future carrier
on:
  push:
    branches:
      - ci/oreslang-net-future-b3824eae-20261026
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project oreslang-future-carrier/net/OresFutureCarrier.csproj -c Release
