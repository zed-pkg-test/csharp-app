name: agent-typescript-nix-plan-fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/agent-typescript-nix-plan-fix.yml"

permissions:
  contents: write

concurrency:
  group: den-1418-typescript-plan-fix
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/den-1418-typescript-nix-plan
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Align Nix attribute and system validation with zed-interfaces
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('clients/typescript/src/nix-export-plan.ts')
          text = path.read_text()
          replacements = [
              (
                  'const NIX_SYSTEM_RE = /^[a-z0-9_]+-[a-z0-9_]+$/;',
                  'const NIX_SYSTEM_RE = /^[a-z0-9_]+(?:-[a-z0-9_]+)+$/;',
              ),
              (
                  '''function artifactRelativePath(value: unknown, label: string): string {''',
                  '''function nixAttributePath(value: string, label: string): string {
              if (value.length === 0 || !value.split(".").every((part) => NIX_IDENTIFIER_RE.test(part))) {
                throw new NixExportPlanError(`${label} must be a dot-separated Nix attribute path`);
              }
              return value;
            }

            function artifactRelativePath(value: unknown, label: string): string {''',
              ),
              (
                  '''    attribute: nixIdentifier(string(parsed.attribute, "intent.attribute"), "intent.attribute"),''',
                  '''    attribute: nixAttributePath(string(parsed.attribute, "intent.attribute"), "intent.attribute"),''',
              ),
          ]
          for before, after in replacements:
              if before not in text:
                  raise SystemExit(f'alignment anchor not found: {before[:80]!r}')
              text = text.replace(before, after, 1)
          path.write_text(text)
          PY
          npm ci
          npm run build
          npm test
          git rm .github/workflows/agent-typescript-nix-plan-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/typescript/src/nix-export-plan.ts
          git diff --cached --check
          git commit -m "fix(DEN-1418): align TypeScript Nix plan validation"
          git push origin HEAD:agent/den-1418-typescript-nix-plan
        working-directory: .
