# Re-run against the pinned client harness after Gleam dependency hydration.
name: format SDKs with pinned client toolchains

on:
  push:
    branches:
      - agent/format-pinned-client-toolchains
    paths:
      - .github/workflows/format-pinned-client-toolchains.yml

permissions:
  contents: read

concurrency:
  group: format-pinned-client-toolchains-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  format-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out clean formatting branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/format-pinned-client-toolchains
          path: zed-clients
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Check out exact interface sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: 6e893ad0f28ccfbb7722f007d75e88548f1bcfdf
          path: zed-interfaces
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Materialize the reviewed pinned toolchain only
        working-directory: zed-clients
        run: |
          set -euo pipefail
          git fetch --no-tags origin alexanderdmills/den-359-zed-clients-nix-agent-shell-v3
          source_ref=origin/alexanderdmills/den-359-zed-clients-nix-agent-shell-v3
          for path in \
            flake.nix \
            flake.lock \
            .nix/agent-check.sh \
            .nix/dev-shell.nix; do
            mkdir -p "$(dirname "$path")"
            git show "$source_ref:$path" > "$path"
          done
          git add -N flake.nix flake.lock .nix/agent-check.sh .nix/dev-shell.nix

      - name: Install pinned Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Apply canonical language formatters
        working-directory: zed-clients
        run: |
          set -euo pipefail
          nix develop --no-update-lock-file -c bash -lc '
            set -euo pipefail
            gofmt -w clients/go/nix_adapter.go clients/go/nix_adapter_test.go
            cargo fmt --manifest-path clients/rust/Cargo.toml
            (
              cd clients/dart
              dart pub get
              dart format lib test
            )
            (
              cd clients/gleam
              gleam deps download
              gleam format
            )
          '
          git diff --check

          # The strict Dart stage intentionally treats any *unstaged* formatter
          # output as drift. Stage the reviewed mechanical product delta before
          # validation so each native formatter can verify the candidate tree
          # without confusing the expected changes with fresh drift.
          git add \
            clients/go/nix_adapter.go \
            clients/go/nix_adapter_test.go \
            clients/rust/src/lib.rs \
            clients/dart/lib/src/client.dart \
            clients/dart/lib/src/models.dart \
            clients/dart/test/hardening_test.dart \
            clients/dart/test/zed_pkg_client_test.dart \
            clients/gleam/src/zed_pkg_client.gleam \
            clients/gleam/test/publish_hardening_test.gleam \
            clients/gleam/test/zed_pkg_client_test.gleam

      - name: Validate every repaired SDK with the same pinned environment
        working-directory: zed-clients
        run: |
          set -euo pipefail
          nix develop --no-update-lock-file -c agent-check go
          nix develop --no-update-lock-file -c agent-check rust
          nix develop --no-update-lock-file -c agent-check dart
          nix develop --no-update-lock-file -c agent-check gleam

      - name: Commit only mechanical product formatting
        working-directory: zed-clients
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git reset -- flake.nix flake.lock .nix/agent-check.sh .nix/dev-shell.nix
          rm -f \
            .github/workflows/format-pinned-client-toolchains.yml \
            flake.nix \
            flake.lock \
            .nix/agent-check.sh \
            .nix/dev-shell.nix
          rmdir .nix 2>/dev/null || true
          git add \
            clients/go/nix_adapter.go \
            clients/go/nix_adapter_test.go \
            clients/rust/src/lib.rs \
            clients/dart/lib/src/client.dart \
            clients/dart/lib/src/models.dart \
            clients/dart/test/hardening_test.dart \
            clients/dart/test/zed_pkg_client_test.dart \
            clients/gleam/src/zed_pkg_client.gleam \
            clients/gleam/test/publish_hardening_test.gleam \
            clients/gleam/test/zed_pkg_client_test.gleam \
            .github/workflows/format-pinned-client-toolchains.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format SDKs with pinned client toolchains'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/format-pinned-client-toolchains
